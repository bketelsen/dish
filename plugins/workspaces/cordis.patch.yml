# The mechanics behind dish's projects (the dishWorkspaces service): clones
# under the work root, the GitHub App (read tokens and the credential helper),
# setup on merged code, workspace registration, the scratch workspace, task
# worktrees and the sweep, and the `worktree` tool. It imports dish-projects'
# `Project` type; neither plugin waits for the other at load. Its browser half is
# Settings → GitHub App: the App's ID and private key (set through dsh's own
# credentials remote, never through dish's server) and a Test button.
# Config rows: `appIdName` (the credential's env-var name for the App ID;
# DISH_GITHUB_APP_ID by default), `privateKeyName` (the same for the App's
# private key; DISH_GITHUB_APP_PRIVATE_KEY by default) and `terminal` (print
# the plugin's own log lines to the terminal).
- insert:
    - id: dish-workspaces
      name: dish-workspaces
