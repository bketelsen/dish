provider: github-copilot
families:                 # model ids per family and tier; a family's models identify it
  anthropic: { strong: claude-opus-5.5, mid: claude-sonnet-5.5 }
  openai:    { strong: gpt-6.1-sol,     mid: gpt-5.6-sol }
reviewerFamilies: [openai, anthropic]   # the reviewer takes the first one that isn't the reviewed work's
limits:
  running: 4              # crew children running at once, per session
  writers: 1              # of those, roles with writes: true
  perSession: 30          # delegations a session may start, ever
roles:
  architect:  { tier: strong, family: anthropic, writes: true,  tools: [read, glob, grep, write, edit, web_search, web_fetch, skill, todo_write, send_message, recall, ask_judge] }
  coder:      { tier: mid,    family: anthropic, writes: true,  tools: [read, read_image, glob, grep, write, edit, bash, job_output, job_list, job_kill, web_fetch, browser_navigate, browser_back, browser_read, browser_click, browser_type, browser_press, browser_select, browser_scroll, browser_wait, browser_screenshot, skill, todo_write, send_message, recall, ask_judge] }
  reviewer:   { tier: mid,    reviews: true,                    tools: [read, read_image, glob, grep, bash, job_output, job_list, job_kill, web_fetch, browser_navigate, browser_back, browser_read, browser_click, browser_type, browser_press, browser_select, browser_scroll, browser_wait, browser_screenshot, skill, todo_write, send_message, recall, ask_judge] }
  researcher: { tier: mid,    family: anthropic,                tools: [read, glob, grep, web_search, web_fetch, skill, todo_write, send_message, recall, ask_judge] }
  ops:        { tier: mid,    family: anthropic, writes: true,  tools: [read, glob, grep, write, edit, bash, job_output, job_list, job_kill, web_search, web_fetch, skill, todo_write, send_message, recall, ask_judge] }
  writer:     { tier: mid,    family: anthropic, writes: true,  tools: [read, read_image, glob, grep, write, edit, web_search, web_fetch, browser_navigate, browser_back, browser_read, browser_click, browser_type, browser_press, browser_select, browser_scroll, browser_wait, browser_screenshot, skill, todo_write, send_message, recall, ask_judge] }
